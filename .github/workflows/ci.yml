name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flashcode
          POSTGRES_PASSWORD: flashcode
          POSTGRES_DB: flashcode
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Migrations apply cleanly, and the account tests run against them.
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://flashcode:flashcode@localhost:5432/flashcode
      - run: npm test
        env:
          DATABASE_URL: postgres://flashcode:flashcode@localhost:5432/flashcode
          BETTER_AUTH_SECRET: ci-auth-secret-0123456789abcdef0123
      # Every reference solution must pass and every wrong*.cpp must fail (C++23).
      - run: npm run verify
        env:
          FLASH_RUNNER: local
      - run: npm run build

  # Builds the sandbox runner, runs it under gVisor, attacks it, and grades
  # every problem through it.
  sandbox:
    runs-on: ubuntu-24.04
    env:
      FLASH_SANDBOX_URL: http://127.0.0.1:8080
      FLASH_SANDBOX_TOKEN: ci-runner-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
      - run: docker build -f runner/Dockerfile -t flashcode-runner .
      - name: Start the runner under gVisor
        run: |
          docker run -d --name runner --runtime=runsc --memory 4g \
            -p 127.0.0.1:8080:8080 -e RUNNER_TOKEN="$FLASH_SANDBOX_TOKEN" flashcode-runner
          for i in $(seq 30); do curl -fs "$FLASH_SANDBOX_URL/healthz" && exit 0; sleep 1; done
          docker logs runner; exit 1
      - run: npx vitest run tests/sandbox-isolation.test.ts
      - run: npm run verify
        env:
          FLASH_RUNNER: sandbox
      - if: failure()
        run: docker logs runner

  # Brings up the production stack from deploy/ (Caddy, web, worker, Postgres,
  # the runner under gVisor) the way the Deploy workflow does, then grades a
  # real submission through it.
  deploy:
    runs-on: ubuntu-24.04
    env:
      FLASHCODE_ROOT: ${{ runner.temp }}/flashcode
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
      - name: Write a throwaway env file
        run: |
          mkdir -p "$FLASHCODE_ROOT"
          {
            echo SITE_DOMAIN=localhost
            for v in POSTGRES_PASSWORD SESSION_SECRET BETTER_AUTH_SECRET RUNNER_TOKEN; do echo "$v=$(openssl rand -hex 32)"; done
          } > "$FLASHCODE_ROOT/.env"
      - run: deploy/deploy.sh
        env:
          DEPLOY_CHECK_INSECURE: "1"
      - run: deploy/smoke-test.sh https://localhost
        env:
          SMOKE_INSECURE: "1"
      - name: The runner has no way out
        run: |
          ! docker exec flashcode-runner-1 python3 -c "import urllib.request; urllib.request.urlopen('https://example.com', timeout=5)"
      - if: failure()
        run: docker compose -p flashcode logs --no-color
