name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Every reference solution must pass and every wrong*.cpp must fail,
      # under both standards the runners may use.
      - run: npm run verify
        env:
          FLASH_RUNNER: local
          FLASH_CXX_STD: c++20
      - run: npm run verify
        env:
          FLASH_RUNNER: local
          FLASH_CXX_STD: c++17
      - run: npm run build
