name: Deploy

# Once CI passes on main (or on demand from the Actions tab): builds the app
# and runner images for x86 and Arm, pushes them to ghcr.io, and has the
# production server pull and start them. The deploy job does nothing until the
# server is set up (deploy/README.md): variable DEPLOY_HOST, secrets
# DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/flashcode-app
  RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/flashcode-runner

jobs:
  # Each architecture builds on its own machine: the runner image compiles
  # nsjail, which is far too slow under emulation.
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: ${{ env.RUNNER_IMAGE }}:${{ env.SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,scope=runner-${{ matrix.arch }},mode=max

  # One tag per image that works on both architectures.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for image in "$APP_IMAGE" "$RUNNER_IMAGE"; do
            docker buildx imagetools create -t "$image:$SHA" -t "$image:latest" "$image:$SHA-amd64" "$image:$SHA-arm64"
          done

  deploy:
    needs: publish
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN || 'litecode.io' }}
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The compose file, Caddyfile and scripts still come from the commit.
      - name: Copy the release to the server
        run: |
          git archive --format=tar.gz HEAD \
            | ssh "$TARGET" "set -e; d=/opt/flashcode/releases/$SHA; rm -rf \$d; mkdir -p \$d; tar -xzf - -C \$d"
      # This job's token can read the images (whatever the packages'
      # visibility) and expires when the job ends; the server logs out anyway.
      - name: Pull and start it
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh "$TARGET" "APP_IMAGE='$APP_IMAGE:$SHA' RUNNER_IMAGE='$RUNNER_IMAGE:$SHA' /opt/flashcode/releases/$SHA/deploy/deploy.sh" || status=$?
          ssh "$TARGET" "docker logout ghcr.io" || true
          exit $status
