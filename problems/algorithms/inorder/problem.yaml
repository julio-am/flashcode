title: Inorder traversal of a BST
prompt: |
  Write `void inorder(TreeNode* root, std::vector<int>& out)` that appends the tree's values to `out` in inorder (left subtree, node, right subtree).
given: |
  struct TreeNode {
    int val;
    TreeNode* left;
    TreeNode* right;
    explicit TreeNode(int v) : val(v), left(nullptr), right(nullptr) {}
  };
  // The BST built from 5, 3, 8, 1, 4 gives {1, 3, 4, 5, 8}
