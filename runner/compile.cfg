# nsjail config for compiling one submission. The server adds the job's
# directory as a read-write bind on /work and picks the outside uid.
name: "flashcode-compile"
mode: ONCE
hostname: "jail"
cwd: "/work"
time_limit: 10
max_cpus: 1
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/work"
envar: "TMPDIR=/tmp"

rlimit_as: 1536
rlimit_cpu: 10
rlimit_fsize: 64
rlimit_nofile: 128
rlimit_core: 0
rlimit_stack: 16

# gVisor does not enforce RLIMIT_NPROC, so the process count is capped with
# a pids cgroup (v1, which is what gVisor exposes). The server creates the
# NSJAIL parent group at startup. gVisor's memory cgroup is not enforced
# either; RLIMIT_AS (which is) bounds each process instead.
cgroup_pids_max: 32

clone_newnet: true
# A new network namespace with not even loopback up: no network at all.
iface_no_lo: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
# gVisor rejects CLONE_NEWCGROUP.
clone_newcgroup: false

mount_proc: false
mount { src: "/usr" dst: "/usr" is_bind: true rw: false }
mount { src: "usr/bin" dst: "/bin" is_symlink: true }
mount { src: "usr/lib" dst: "/lib" is_symlink: true }
mount { src: "usr/lib64" dst: "/lib64" is_symlink: true }
mount { src: "/opt/flash" dst: "/opt/flash" is_bind: true rw: false }
mount { dst: "/tmp" fstype: "tmpfs" options: "size=64m" rw: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
