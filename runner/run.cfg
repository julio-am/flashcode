# nsjail config for running one compiled submission. The server adds the
# job's directory as a read-only bind on /work, the outside uid, and the
# time and CPU limits.
name: "flashcode-run"
mode: ONCE
hostname: "jail"
cwd: "/work"
time_limit: 3
max_cpus: 1
keep_env: false
envar: "PATH=/usr/bin:/bin"

rlimit_as: 256
rlimit_cpu: 2
# Nothing in the jail is writable; this only bounds stdout (gVisor applies it
# to pipes too). The server caps output at 64 KiB anyway.
rlimit_fsize: 1
rlimit_nofile: 32
rlimit_core: 0
rlimit_stack: 8

# gVisor does not enforce RLIMIT_NPROC, so the process count is capped with
# a pids cgroup (v1, which is what gVisor exposes). The server creates the
# NSJAIL parent group at startup. gVisor's memory cgroup is not enforced
# either; RLIMIT_AS (which is) bounds each process instead.
cgroup_pids_max: 8

# No new processes, only threads: fork, vfork and clone without CLONE_VM fail
# with EPERM (clone3 reports ENOSYS so glibc falls back to clone). Besides
# making fork bombs pointless, this matters for gVisor itself: each new
# address space costs it a host-side stub process, and a fork bomb churning
# through them can crash the whole sandbox.
seccomp_string: "ERRNO(1) { fork, vfork, clone { (clone_flags & 0x100) == 0 } }"
seccomp_string: "ERRNO(38) { clone3 }"
seccomp_string: "DEFAULT ALLOW"

clone_newnet: true
# A new network namespace with not even loopback up: no network at all.
iface_no_lo: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
# gVisor rejects CLONE_NEWCGROUP.
clone_newcgroup: false

mount_proc: false
mount { src: "/usr/lib" dst: "/usr/lib" is_bind: true rw: false }
mount { src: "usr/lib" dst: "/lib" is_symlink: true }
mount { src: "usr/lib64" dst: "/lib64" is_symlink: true }
mount { src: "/usr/lib64" dst: "/usr/lib64" is_bind: true rw: false }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
